services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: neighborhood_intelligence
      POSTGRES_USER: nii
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports: ["5432:5432"]
    volumes: ["postgis_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nii -d neighborhood_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgis_data:
