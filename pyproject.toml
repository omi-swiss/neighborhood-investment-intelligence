[project]
name = "neighborhood-investment-intelligence"
version = "0.1.0"
description = "Traceable U.S. census-tract fundamentals pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "click==8.1.7",
  "duckdb==1.1.3",
  "httpx==0.28.1",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "PyYAML==6.0.2",
  "tenacity==9.0.0",
  "typer==0.15.1",
]

[project.optional-dependencies]
geospatial = ["geopandas==1.0.1", "pyogrio==0.10.0", "shapely==2.0.6"]
production = ["psycopg[binary]==3.2.3"]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.4"]

[project.scripts]
nii = "neighborhood_intelligence.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
